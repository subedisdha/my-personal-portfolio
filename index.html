  <!--
    Failsafe: this plain script always runs, even where ES modules are blocked
    (e.g. opening the file directly via file://). If the app hasn't booted a few
    seconds in, it replaces the dark void with an explanation instead.
  -->
  <script>
    (function () {
      function show(title, detail) {
        var n = document.getElementById('boot-failsafe');
        if (!n) {
          n = document.createElement('div');
          n.id = 'boot-failsafe';
          n.style.cssText =
            'position:fixed;inset:0;z-index:300;background:#070d1a;color:#e8f0f7;' +
            'display:flex;flex-direction:column;align-items:center;justify-content:center;' +
            'gap:16px;padding:2rem;text-align:center;' +
            'font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.7';
          document.body.appendChild(n);
        }
        n.innerHTML =
          '<p style="margin:0;color:#6ee7f0;letter-spacing:.24em;text-transform:uppercase;font-size:11px">' +
            title + '</p>' +
          '<p id="boot-failsafe-msg" style="margin:0;max-width:600px"></p>' +
          '<p id="boot-failsafe-detail" style="margin:0;max-width:640px;color:#9aa396;font-size:12px;' +
            'white-space:pre-wrap;word-break:break-word"></p>';
        return {
          msg: n.querySelector('#boot-failsafe-msg'),
          detail: n.querySelector('#boot-failsafe-detail'),
        };
      }

      // Surface uncaught startup errors visibly instead of a silent black page.
      window.addEventListener('error', function (e) {
        if (window.__PORTFOLIO_BOOTED__) return;
        var slots = show('startup error', '');
        slots.msg.textContent = 'A script error stopped the portfolio from starting.';
        slots.detail.textContent =
          (e && e.message ? e.message : 'unknown error') +
          (e && e.filename ? '\n' + e.filename + ':' + (e.lineno || '') : '');
      });

      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          if (window.__PORTFOLIO_BOOTED__) return;
          var log = document.getElementById('boot-log');
          if (log && log.childElementCount > 0) return; // boot sequence is running
          var slots = show('not served over http', '');
          slots.msg.textContent =
            'This page was most likely opened directly from disk. Browsers block module ' +
            'scripts over file:// — so nothing can load and the page stays black.';
          slots.detail.textContent =
            'Fix — serve it locally, then open the printed localhost URL:\n\n' +
            '  npm run dev                      development\n' +
            '  npm run build + npm run preview  production';
        }, 4500);
      });
    })();
  </script>
